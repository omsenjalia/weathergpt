<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Glow & Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowGrad)" stroke-width="8"/>
  
  <!-- Sun Aura Glow -->
  <circle cx="256" cy="220" r="110" fill="url(#sunGrad)" filter="url(#glow)" opacity="0.3"/>
  
  <!-- Sun Core -->
  <circle cx="256" cy="220" r="85" fill="url(#sunGrad)"/>
  
  <!-- Sun Rays -->
  <g stroke="url(#sunGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="90" x2="256" y2="115"/>
    <line x1="256" y1="325" x2="256" y2="350"/>
    <line x1="126" y1="220" x2="151" y2="220"/>
    <line x1="361" y1="220" x2="386" y2="220"/>
    <line x1="164" y1="128" x2="182" y2="146"/>
    <line x1="330" y1="294" x2="348" y2="312"/>
    <line x1="164" y1="312" x2="182" y2="294"/>
    <line x1="330" y1="146" x2="348" y2="128"/>
  </g>
  
  <!-- Stylized Cloud Overlay -->
  <path d="M 180 340 A 55 55 0 0 1 230 260 A 75 75 0 0 1 360 270 A 50 50 0 0 1 390 340 Z" fill="url(#cloudGrad)"/>
</svg>
